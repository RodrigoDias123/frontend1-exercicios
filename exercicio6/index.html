<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6 - APIs Nativas</title>
</head>
<body>
    <h1>2 APIs Nativas do Browser</h1>

    <h2>1. Web Share API</h2>
    <p>Partilha texto através do menu nativo de partilha.</p>
    <input type="text" id="texto" placeholder="Escreve algo...">
    <button id="btn-partilhar">Partilhar</button>
    <p id="resultado-share"></p>

    <hr>

    <h2>2. Speech Synthesis API</h2>
    <p>O browser lê o texto em voz alta.</p>
    <input type="text" id="texto-falar" value="Olá mundo!">
    <button id="btn-falar">Falar</button>

    <script src="script.js"></script>
</body>
</html>
