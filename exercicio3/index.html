<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Passwords</title>
  </head>
  <body>
    <div class="container">
      <h1>Gestor de Passwords</h1>

      <div class="form">
        <input
          type="password"
          id="passwordInput"
          placeholder="Escreve a tua password..."
        />
        <button id="saveBtn">Guardar</button>
      </div>

      <h2>Passwords Guardadas</h2>
      <div id="passwordsaved"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
