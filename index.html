<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Gestão de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-list-check"></i> TaskFlow</h1>
        </header>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Adicionar nova tarefa...">
            <button class="btn-add" id="btnAdd" title="Adicionar Tarefa">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <ul id="todoList" class="todo-list">
            </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
